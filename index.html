<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trắc nghiệm Quy định 207-QĐ/TW</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#B3171F">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#F3F5F9;--card:#FFFFFF;--card2:#F4F6FA;--line:#DCE2EB;--ink:#15202E;--muted:#5B6B7E;
--red:#B3171F;--red-h:#8E1218;--red-bg:#FCEBEC;--gold:#F2B205;--gold-h:#D99F00;--gold-ink:#3A2A00;--gold-bg:#FFF3C9;--gold-tx:#6B4B00;
--ok:#157A47;--ok-bg:#E2F5EA;--bad:#C0281F;--bad-bg:#FDE9E7;--blue:#2F6FDE;--band:#7E0F15;--cream:#F6D5D7;--shadow:0 6px 24px rgba(21,32,46,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1420;--card:#162131;--card2:#1C2A3D;--line:#2B3B52;--ink:#EAF0F8;--muted:#9DB0C6;
--red:#E5484D;--red-h:#C93A40;--red-bg:#3A1D24;--gold:#F5C547;--gold-h:#E2B23A;--gold-ink:#2B1F00;--gold-bg:#3A3010;--gold-tx:#F5D77A;
--ok:#5FD39A;--ok-bg:#123626;--bad:#FF8A80;--bad-bg:#40191A;--blue:#6AA2FF;--band:#3B070C;--cream:#F1C9CC;--shadow:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0D1420;--card:#162131;--card2:#1C2A3D;--line:#2B3B52;--ink:#EAF0F8;--muted:#9DB0C6;
--red:#E5484D;--red-h:#C93A40;--red-bg:#3A1D24;--gold:#F5C547;--gold-h:#E2B23A;--gold-ink:#2B1F00;--gold-bg:#3A3010;--gold-tx:#F5D77A;
--ok:#5FD39A;--ok-bg:#123626;--bad:#FF8A80;--bad-bg:#40191A;--blue:#6AA2FF;--band:#3B070C;--cream:#F1C9CC;--shadow:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.banner{position:relative;background:var(--band)}
.banner img{display:block;width:100%;height:max(23.6vw,min(42vh,33.7vw));object-fit:cover;object-position:top}
.credit{background:var(--band);color:var(--cream);text-align:center;padding:10px max(16px,env(safe-area-inset-left));font-size:13px;line-height:1.45;letter-spacing:.02em;border-top:3px solid var(--gold)}
.credit b{color:#fff;font-weight:700}
.credit span{display:block}
@media(min-width:760px){.credit span{display:inline}.credit span+span:before{content:"  ·  "}}
.tbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow)}
.banner .tbtn.snd{right:calc(max(10px,env(safe-area-inset-right)) + 48px)}
.banner .tbtn{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));background:rgba(255,255,255,.85);color:#222;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.hero{margin-top:-1px;padding:26px 0 8px}
h1{font-size:clamp(22px,4.6vw,34px);line-height:1.2;margin:0 0 6px;color:var(--red);letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-left:4px solid var(--gold)}
.stat b{display:block;font-size:26px;line-height:1.1;color:var(--red)}
.stat small{color:var(--muted)}
.modes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:16px}
@media(min-width:700px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mode{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:block;width:100%}
.mode.on{border-color:var(--red);background:var(--red-bg)}
.mode h3{margin:0 0 4px;font-size:17px}
.mode p{margin:0;color:var(--muted);font-size:14px}
.go{display:block;width:100%;background:var(--gold);color:var(--gold-ink);border:0;border-radius:14px;padding:15px 20px;font-size:18px;font-weight:800;box-shadow:0 6px 0 var(--gold-h);transition:transform .08s,box-shadow .08s}
.go:hover{background:var(--gold-h)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-h)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:600}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-h);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.best{margin:12px 0 0;text-align:center;color:var(--muted);font-size:14px}
details{margin-top:16px}
summary{cursor:pointer;font-weight:700;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.refs{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.refs li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.refs b{color:var(--red)}
.ladder{margin:22px 0 40px}
.ladder h2,.sec-t{font-size:18px;margin:0 0 10px}
.lad{display:grid;gap:8px}
.lad div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.lad b{min-width:84px;color:var(--red)}
.lad em{font-style:normal;color:var(--muted)}
/* quiz */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;padding-top:max(10px,env(safe-area-inset-top))}
.bar .wrap{display:flex;align-items:center;gap:10px}
.bar .mid{flex:1;min-width:0}
.bar .t1{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:99px;transition:width .3s}
.qlay{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:18px 0 24px}
@media(min-width:900px){.qlay{grid-template-columns:minmax(0,1fr) 280px;align-items:start}.side{position:sticky;top:76px}}
.qtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.tag.red{background:var(--red-bg);color:var(--red);border-color:transparent}
.qtext{font-size:clamp(17px,2.4vw,20px);font-weight:700;line-height:1.4;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--red)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--red);background:var(--red-bg)}
.opt.sel .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.exp{margin-top:14px;border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--card2);font-size:15px}
.exp.ok{background:var(--ok-bg);border-color:var(--ok)}
.exp.bad{background:var(--bad-bg);border-color:var(--bad)}
.exp h4{margin:0 0 6px;font-size:15px}.exp p{margin:0 0 8px;line-height:1.6}.exp p:last-child{margin-bottom:0}.exp p.why{opacity:.82;font-size:14px;border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}
.exp.ok h4{color:var(--ok)}.exp.bad h4{color:var(--bad)}
.srcl{margin:10px 0 0;font-size:14px;color:var(--muted);line-height:1.5}.srcl span{font-size:13px}.srca{color:var(--red);font-weight:700;text-decoration:underline;text-underline-offset:2px;word-break:break-word}
.tip{margin-top:10px;background:var(--gold-bg);color:var(--gold-tx);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:15px}
.tip b{letter-spacing:.06em;font-size:12px;display:block;margin-bottom:2px}
.nav{position:sticky;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding:10px 0;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.nav .wrap{display:flex;gap:10px}
.nav .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.gn{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;padding:0;position:relative}
.gn.cur{outline:3px solid var(--gold)}
.gn.done{background:var(--red);border-color:var(--red);color:#fff}
.gn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.gn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.gn.fl:after{content:"⚑";position:absolute;top:-6px;right:-3px;font-size:13px;color:var(--gold)}
.legend{font-size:12px;color:var(--muted);margin-top:10px}
.flagb{font-size:13px;padding:6px 12px;border-radius:99px}
.flagb.on{background:var(--gold-bg);border-color:var(--gold);color:var(--gold-tx)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.ov .card{max-width:420px;width:100%}
.ov h3{margin:0 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1}
/* result */
.rtop{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center;text-align:center}
@media(min-width:760px){.rtop{grid-template-columns:200px minmax(0,1fr);text-align:left}}
.ring{position:relative;width:180px;height:180px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--line);stroke-width:12}
.ring .fg{fill:none;stroke:var(--red);stroke-width:12;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:40px;line-height:1;color:var(--red)}
.ring .num small{color:var(--muted)}
.gb{display:inline-block;background:var(--gold);color:var(--gold-ink);font-weight:800;border-radius:99px;padding:4px 16px;font-size:18px;margin-bottom:6px}
.rstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
@media(min-width:700px){.rstats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.rs b{display:block;font-size:24px}
.rs.ok b{color:var(--ok)}.rs.bad b{color:var(--bad)}
.rs small{color:var(--muted)}
.comments{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:0 0 16px}
.comments p{margin:0;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:15px}
.meters{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.meter-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;margin-bottom:4px}
.meter-top span{color:var(--muted)}
.mbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px;width:0;transition:width .9s ease}
.l-hi i{background:var(--ok)}.l-mid i{background:var(--gold)}.l-lo i{background:var(--bad)}
.recall{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:0;padding:0;list-style:none}
.recall li{background:var(--gold-bg);color:var(--gold-tx);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:14px}
.sec{margin-top:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border-radius:99px;padding:6px 14px;font-size:14px;border:1px solid var(--line);background:var(--card)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.rv{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.rv .card{padding:16px}
.rv .opt{cursor:default;padding:8px 12px}
.rv .opt:hover{border-color:var(--line)}
.rv .opt.ok:hover{border-color:var(--ok)}.rv .opt.bad:hover{border-color:var(--bad)}
.acts{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:18px 0 40px}
@media(min-width:700px){.acts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.btn.sm{padding:8px 14px;font-size:14px}
.privacy{margin:10px 0 0;text-align:center;color:var(--muted);font-size:13px}
.bigstat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
@media(min-width:700px){.bigstat{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hq{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.hq li{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.hq b{color:var(--red)}
.note{padding:14px 16px;background:var(--gold-bg);color:var(--gold-tx);border-radius:12px;margin:20px 0;font-size:15px}
#boot{padding:24px;margin:24px auto;max-width:560px;background:var(--gold-bg);color:var(--gold-tx);border-radius:12px;font-size:15px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app"></div>
<div id="boot" class="wrap">Đang tải bài trắc nghiệm… Nếu dòng này vẫn hiện sau vài giây, ứng dụng xem trước (Zalo, Messenger, trình xem file…) đang chặn script. Hãy mở file bằng <b>Chrome</b> hoặc <b>Safari</b>: chạm “Mở bằng trình duyệt”, hoặc chép file vào máy rồi mở từ trình duyệt.</div>
<noscript><div class="wrap note">Trình duyệt đang tắt JavaScript nên không chạy được bài. Hãy bật JavaScript hoặc mở bằng Chrome/Safari.</div></noscript>

<script>
(function(){
"use strict";
var DATA={"THEMES":{"A":{"t":"Phát ngôn, bài viết, mạng xã hội","d":"Điều 3, 4, 5"},"B":{"t":"Góp ý, phản ánh, tố cáo","d":"Điều 6, 7"},"C":{"t":"Chức vụ, quyền hạn, công việc hằng ngày","d":"Điều 10, 11"},"D":{"t":"Cán bộ, ứng cử, quan hệ","d":"Điều 1, 2, 12"},"E":{"t":"Tiền bạc, quà tặng, tài sản","d":"Điều 9, 13, 14, 15, 16"},"F":{"t":"Kiểm tra, kỷ luật, trật tự xã hội","d":"Điều 8, 17"},"G":{"t":"Đời sống riêng, gia đình, tín ngưỡng","d":"Điều 18, 19"}},"TYPES":{"NH":"Nhận diện hành vi","RG":"Phân biệt ranh giới"},"GRADES":[{"min":9,"name":"Nắm vững","cls":"g-top","note":"Bạn nhận diện chính xác những việc đảng viên không được làm và cả ranh giới giữa việc được và không được."},{"min":8,"name":"Hiểu tốt","cls":"g-good","note":"Bạn hiểu tốt nội dung chính; chỉ còn nhầm một vài tình huống."},{"min":7,"name":"Khá","cls":"g-fair","note":"Bạn nắm được phần lớn nội dung; cần đọc lại các điều làm sai để tránh nhầm giữa các điều gần nghĩa."},{"min":5,"name":"Đạt","cls":"g-pass","note":"Đạt mức tối thiểu; nên học lại bằng chế độ học, đọc kỹ dòng “Cần nhớ” rồi làm lại."},{"min":0,"name":"Cần ôn lại","cls":"g-fail","note":"Nên đọc lại toàn văn Quy định, học lại từng tình huống ở chế độ học rồi làm lại bài."}],"REF":[["Điều 1","Nói, viết, làm trái hoặc không thực hiện chủ trương, quy định của Đảng, pháp luật của Nhà nước; làm việc pháp luật không cho phép."],["Điều 2","Không chấp hành đúng nguyên tắc tổ chức, hoạt động của Đảng; tự ứng cử, nhận đề cử, đề cử chức danh ở tổ chức nhà nước, Mặt trận, đoàn thể, hội quần chúng, tổ chức tôn giáo, tổ chức nước ngoài khi chưa được tổ chức đảng có thẩm quyền cho phép."],["Điều 3","Phản bác, phủ định, xuyên tạc chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh, đường lối đổi mới; không nêu gương; chủ nghĩa cá nhân, cơ hội, vụ lợi, lợi ích nhóm, tư duy nhiệm kỳ; đoàn kết xuôi chiều, dân chủ hình thức, thấy sai không đấu tranh; độc đoán, chuyên quyền, lạm quyền, quan liêu, xa rời quần chúng."],["Điều 4","Làm lộ, làm mất, đăng tải tài liệu bí mật hoặc việc chưa được phép công bố; tàng trữ, tuyên truyền, phát tán hoặc xúi giục phát tán thông tin trái đường lối, chủ trương, chính sách, pháp luật."],["Điều 5","Viết, nói, đăng, cung cấp thông tin sai sự thật; không đăng phản hồi, cải chính; sáng tác, xuất bản, cổ xúy sản phẩm văn hoá xấu, xuyên tạc lịch sử, bôi nhọ lãnh tụ, lãnh đạo; phát tán bài viết, phỏng vấn, hồi ký, phim, ảnh không đúng quy định; dùng Internet, mạng xã hội, trí tuệ nhân tạo để phát tán thông tin sai sự thật."],["Điều 6","Tố cáo bịa đặt; đơn tố cáo giấu tên, mạo tên; gửi đơn đến nơi không có thẩm quyền; kích động, xúi giục, mua chuộc, ép người khác khiếu nại, tố cáo; đe doạ, trù dập, trả thù người tố cáo, góp ý, đấu tranh chống tiêu cực."],["Điều 7","Bè phái, cục bộ gây mất đoàn kết; lợi dụng phản ánh, góp ý, chất vấn để đả kích, vu cáo, xúc phạm, đánh giá tuỳ tiện."],["Điều 8","Tổ chức, tham gia, tài trợ, giúp tổ chức, hội trái quy định; biểu tình, tụ tập đông người gây mất an ninh, trật tự, an toàn xã hội."],["Điều 9","Kê khai, giải trình lý lịch, tài sản, thu nhập không trung thực; dùng văn bằng, chứng chỉ không hợp pháp; chuyển tiền, tài sản ra nước ngoài, mở tài khoản, mua bán tài sản ở nước ngoài, nhập quốc tịch trái quy định."],["Điều 10","Lợi dụng chủ trì, tham mưu để ban hành văn bản trái quy định; huy động, phân bổ, sử dụng nguồn lực thiếu minh bạch; thiết kế tiêu chí riêng biệt tạo lợi thế, gây cạnh tranh bất bình đẳng."],["Điều 11","Vi phạm đạo đức công vụ; bao che, báo cáo sai sự thật; nhũng nhiễu thủ tục hành chính; né tránh, đùn đẩy, làm việc cầm chừng; biết tham nhũng mà không báo cáo, xử lý; để người thân lợi dụng chức vụ; lợi dụng cơ chế thí điểm để vụ lợi, bao che."],["Điều 12","Chạy chức, chạy quyền, can thiệp để được tuyển dụng, bổ nhiệm, khen thưởng, đi nước ngoài, hưởng chính sách trái quy định; lợi dụng sắp xếp bộ máy để bố trí người không đủ năng lực vào vị trí phân bổ nguồn lực."],["Điều 13","Tham ô, đưa, nhận, môi giới hối lộ; tổ chức, tham gia, tạo điều kiện cho trốn thuế, lừa đảo, rửa tiền, đi vay, cho vay trái pháp luật."],["Điều 14","Tặng, nhận quà dưới mọi hình thức để tác động dẫn đến quyết định sai, có lợi ích riêng."],["Điều 15","Không thực hành tiết kiệm; để thất thoát, lãng phí; đầu tư, mua sắm, dùng tài chính, tài sản công trái quy định; tẩu tán tài sản, hợp thức hoá sai phạm."],["Điều 16","Can thiệp để bản thân, người thân đi du lịch, học tập, chữa bệnh bằng nguồn tài trợ của tổ chức, cá nhân liên quan đến ngành, lĩnh vực, địa bàn mình theo dõi, quản lý."],["Điều 17","Cản trở, can thiệp vào kiểm tra, giám sát, thanh tra, kiểm toán, điều tra, truy tố, xét xử, thi hành án, xét đặc xá, giải quyết khiếu nại, tố cáo, thi hành kỷ luật; ép buộc, mua chuộc để giảm trách nhiệm, mức xử lý; không chấp hành kết luận, quyết định của cơ quan có thẩm quyền."],["Điều 18","Đánh bạc; sử dụng ma tuý; rượu, bia không đúng quy định hoặc đến mức trái đạo đức, vi phạm pháp luật; tổ chức cưới, tang xa hoa, lãng phí, vụ lợi; thờ ơ, vô cảm với sai trái; bạo lực gia đình; vi phạm quy định về hôn nhân, gia đình, kết hôn với người nước ngoài."],["Điều 19","Mê tín, hoạt động mê tín; ủng hộ hoặc tham gia tôn giáo bất hợp pháp; lợi dụng tôn giáo, tín ngưỡng, chính sách dân tộc để trục lợi, làm điều trái đạo đức xã hội, vi phạm pháp luật."]],"BANK":[{"s":"A","y":"RG","r":"Điều 5","q":"Bạn là đảng viên và đang dùng mạng xã hội. Việc nào sau đây bạn KHÔNG được làm?","o":["Chia sẻ một đoạn tin về lãnh đạo địa phương mà bạn biết rõ là bịa đặt","Không chia sẻ một đoạn tin chưa được kiểm chứng","Phản ánh nội dung sai lệch đến cơ quan có thẩm quyền","Đăng bài đính chính khi phát hiện bài mình đăng có thông tin sai"],"e":"Điều 5 cấm viết, nói, đăng bài hoặc cung cấp thông tin sai sự thật, và cấm dùng Internet, mạng xã hội, nền tảng số, trí tuệ nhân tạo để tạo lập, phát tán thông tin sai sự thật. Ba việc còn lại không bị cấm; đính chính còn là việc cần làm, vì Điều 5 cũng cấm “không đăng tải ý kiến phản hồi, cải chính theo quy định”.\nVì sao các phương án còn lại chưa đúng: Không chia sẻ tin chưa kiểm chứng là cách làm thận trọng; phản ánh nội dung sai lệch đến cơ quan có thẩm quyền và đăng bài đính chính đều là việc nên làm, không nằm trong điều cấm. Điều bị cấm là chủ động đăng, chia sẻ thông tin mà mình biết là sai sự thật.","t":"Trước khi đăng hay chia sẻ, kiểm tra nguồn tin. Biết là sai mà vẫn lan truyền là vi phạm."},{"s":"A","y":"NH","r":"Điều 5","q":"Bạn dùng công cụ trí tuệ nhân tạo tạo một clip giả phát ngôn của một lãnh đạo địa phương rồi đăng lên mạng xã hội “cho vui”. Nhận định nào đúng?","o":["Vi phạm Điều 5, vì dùng trí tuệ nhân tạo và mạng xã hội để tạo lập, phát tán thông tin sai sự thật","Không vi phạm vì đây chỉ là nội dung giải trí cá nhân","Không vi phạm vì bạn không có ý chống phá","Chỉ vi phạm nếu clip có hơn một nghìn lượt xem"],"e":"Điều 5 nêu rõ trí tuệ nhân tạo cùng Internet, mạng xã hội, nền tảng số trong số các phương tiện dùng để tạo lập, phát tán thông tin sai sự thật, và cấm bôi nhọ lãnh đạo Đảng, Nhà nước. Điều khoản không đặt ngưỡng lượt xem và không loại trừ nội dung “cho vui”.\nVì sao các phương án còn lại chưa đúng: \"Cho vui\", \"không có ý chống phá\" hay số lượt xem đều không có trong điều khoản. Điều 5 nhìn vào việc dùng AI, mạng xã hội để tạo lập, phát tán thông tin sai sự thật chứ không đo bằng động cơ hay mức lan truyền.","t":"Nội dung giả mạo bằng AI vẫn là thông tin sai sự thật."},{"s":"A","y":"RG","r":"Điều 4","q":"Bạn được đọc một tài liệu nội bộ chưa được phép công bố của cơ quan. Việc nào sau đây bạn KHÔNG được làm?","o":["Chụp lại và đăng nội dung tài liệu lên mạng xã hội","Giữ kín tài liệu theo quy định của cơ quan","Hỏi người có thẩm quyền xem nội dung nào được phép công bố","Chỉ sử dụng tài liệu cho đúng công việc được giao"],"e":"Điều 4 cấm cung cấp, làm lộ, làm mất hoặc viết bài, đăng thông tin, tài liệu, dữ liệu bí mật của Đảng, Nhà nước hoặc những việc chưa được phép công bố theo quy định của Đảng, pháp luật, quy định của cơ quan, đơn vị.\nVì sao các phương án còn lại chưa đúng: Giữ kín tài liệu, hỏi người có thẩm quyền về phạm vi được công bố và chỉ dùng tài liệu đúng nhiệm vụ đều phù hợp với Điều 4. Điều bị cấm là đưa ra ngoài những nội dung chưa được phép công bố.","t":"Chưa được phép công bố thì không đăng, không gửi, không chia sẻ ra ngoài."},{"s":"A","y":"NH","r":"Điều 4","q":"Bạn không tự đăng, nhưng nhắn vào nhóm Zalo: “Ai có điều kiện thì chia sẻ giúp” một tài liệu có quan điểm trái đường lối, chủ trương của Đảng. Nhận định nào đúng?","o":["Vi phạm Điều 4, vì xúi giục người khác tuyên truyền, phát tán tài liệu trái đường lối, chủ trương của Đảng","Không vi phạm vì bạn không trực tiếp đăng tải","Không vi phạm vì nhóm Zalo là nơi riêng tư","Chỉ vi phạm nếu có người thực sự chia sẻ lại"],"e":"Điều 4 cấm tàng trữ, tuyên truyền, phát tán “hoặc xúi giục người khác tuyên truyền, phát tán” thông tin, tài liệu, dữ liệu “dưới mọi hình thức” để truyền bá quan điểm trái đường lối, chủ trương của Đảng, chính sách, pháp luật. Nhờ người khác chia sẻ cũng thuộc phạm vi này.\nVì sao các phương án còn lại chưa đúng: Không trực tiếp đăng, nhóm Zalo là không gian riêng, hay chưa ai chia sẻ lại đều không loại trừ trách nhiệm: Điều 4 cấm cả việc xúi giục người khác phát tán và áp dụng \"dưới mọi hình thức\".","t":"“Dưới mọi hình thức”: nhắn riêng, nhóm kín hay đăng công khai đều tính."},{"s":"A","y":"NH","r":"Điều 3","q":"Trong cuộc họp, bạn biết đề xuất của lãnh đạo có sai sót nhưng vẫn im lặng và giơ tay tán thành “cho yên chuyện”. Theo Quy định, đây là biểu hiện nào?","o":["Thấy sai không đấu tranh, đoàn kết xuôi chiều (Điều 3)","Phục tùng tổ chức đúng nguyên tắc, không vi phạm","Phản bác, phủ định lý luận về đường lối đổi mới (Điều 3)","Báo cáo sai sự thật (Điều 11)"],"e":"Điều 3 liệt kê “đoàn kết xuôi chiều, dân chủ hình thức, thấy đúng không bảo vệ, thấy sai không đấu tranh”. Im lặng trước điều sai để giữ hòa khí chính là biểu hiện này.\nVì sao các phương án còn lại chưa đúng: Phục tùng tổ chức đúng nguyên tắc không có nghĩa là im lặng trước điều sai. Phản bác lý luận về đường lối đổi mới và báo cáo sai sự thật là hành vi khác (Điều 3 và Điều 11) và không khớp với tình huống chỉ im lặng, tán thành.","t":"Giữ hòa khí không thay được trách nhiệm nêu ý kiến trước điều sai."},{"s":"A","y":"NH","r":"Điều 3","q":"Một trưởng đơn vị luôn tự quyết mọi việc, không nghe ý kiến tập thể và rất ít tiếp xúc với người dân. Biểu hiện nào của Điều 3 phù hợp nhất?","o":["Độc đoán, chuyên quyền, quan liêu, xa rời quần chúng","Phản bác, phủ định chủ nghĩa Mác - Lênin","Làm lộ tài liệu bí mật","Kê khai tài sản không trung thực"],"e":"Điều 3 không chỉ nói về tư tưởng mà cả phong cách làm việc: cấm “độc đoán, chuyên quyền, lạm quyền, quan liêu, xa rời quần chúng”, cùng với “lợi ích nhóm”, cục bộ, “tư duy nhiệm kỳ”.\nVì sao các phương án còn lại chưa đúng: Phản bác chủ nghĩa Mác - Lênin, làm lộ tài liệu bí mật (Điều 4) và kê khai tài sản không trung thực (Điều 9) là các hành vi khác. Tình huống nói về phong cách làm việc: tự quyết, không nghe tập thể, xa dân.","t":"Điều 3 cũng nhắc đến trách nhiệm nêu gương và gần gũi quần chúng."},{"s":"A","y":"NH","r":"Điều 5","q":"Bạn có một bài phỏng vấn và một bản hồi ký muốn đưa lên mạng, nhưng chưa qua các bước mà quy định của Đảng, pháp luật yêu cầu. Điều nào đúng?","o":["Phát tán bài phỏng vấn, hồi ký, phim, ảnh không đúng quy định là hành vi bị cấm (Điều 5)","Hồi ký là của cá nhân nên bạn toàn quyền phát tán","Chỉ bị cấm với phim, ảnh, không bị cấm với hồi ký","Chỉ bị cấm nếu nội dung có chống phá"],"e":"Điều 5 (đoạn ba) cấm “phát tán bài viết, bài nói, bài phỏng vấn, hồi ký, phim, ảnh không đúng quy định”. Từ khoá là “không đúng quy định”; câu này không gắn riêng với nội dung chống phá.\nVì sao các phương án còn lại chưa đúng: Là của cá nhân hay chỉ là hồi ký vẫn phải \"đúng quy định\"; điều khoản liệt kê cả bài phỏng vấn, hồi ký, phim, ảnh và không chỉ cấm khi có nội dung chống phá.","t":"Trước khi công bố hồi ký, bài phỏng vấn, phim, ảnh, tìm hiểu quy định áp dụng với mình."},{"s":"B","y":"RG","r":"Điều 6","q":"Bạn nghi ngờ một cán bộ có sai phạm. Việc nào sau đây bạn KHÔNG được làm?","o":["Viết đơn tố cáo giấu tên hoặc mạo tên người khác","Tố cáo đúng sự thật, gửi đến cơ quan có thẩm quyền giải quyết","Góp ý, phê bình trực tiếp tại cuộc họp","Cung cấp thông tin trung thực khi cơ quan kiểm tra yêu cầu"],"e":"Điều 6 cấm tố cáo có nội dung bịa đặt và viết đơn tố cáo giấu tên, mạo tên. Tố cáo đúng sự thật đến nơi có thẩm quyền, góp ý, phê bình hay cung cấp thông tin trung thực không bị cấm.\nVì sao các phương án còn lại chưa đúng: Tố cáo đúng sự thật gửi đúng nơi, góp ý trực tiếp và cung cấp thông tin trung thực đều là quyền và trách nhiệm hợp pháp. Điều 6 chỉ cấm tố cáo bịa đặt, giấu tên, mạo tên.","t":"Tố cáo đúng sự thật, không giấu tên hay mạo tên, gửi đúng nơi có thẩm quyền."},{"s":"B","y":"RG","r":"Điều 6","q":"Bạn có thông tin đúng sự thật về một sai phạm và gửi đơn đến nhiều nơi, trong đó có nơi không có thẩm quyền giải quyết. Nhận định nào đúng?","o":["Việc gửi đơn đến nơi không có thẩm quyền giải quyết vẫn bị cấm theo Điều 6","Không vi phạm vì nội dung đơn đúng sự thật","Không vi phạm vì gửi càng nhiều nơi càng tốt","Chỉ vi phạm nếu nơi nhận từ chối giải quyết"],"e":"Điều 6 cấm “gửi, phát tán đơn khiếu nại, tố cáo dưới mọi hình thức đến nơi không có thẩm quyền giải quyết”. Điều khoản không nêu ngoại lệ khi nội dung đơn đúng.\nVì sao các phương án còn lại chưa đúng: Đúng sự thật là điều kiện cần nhưng chưa đủ: đơn còn phải gửi đến nơi có thẩm quyền. Gửi càng nhiều nơi không làm hành vi hợp lệ hơn, và việc bị cấm không phụ thuộc vào việc nơi nhận có từ chối hay không.","t":"Nội dung đúng chưa đủ; còn phải gửi đúng nơi có thẩm quyền."},{"s":"B","y":"NH","r":"Điều 6","q":"Bạn muốn một đồng nghiệp tố cáo người đang mâu thuẫn với bạn, nên hứa cho tiền để người đó làm đơn. Nhận định nào đúng?","o":["Vi phạm Điều 6: kích động, xúi giục, mua chuộc người khác khiếu nại, tố cáo","Không vi phạm vì bạn không ký tên vào đơn","Không vi phạm vì người kia tự nguyện làm đơn","Chỉ vi phạm nếu đơn tố cáo bị bác bỏ"],"e":"Điều 6 cấm “kích động, xúi giục, mua chuộc, cưỡng ép người khác khiếu nại, tố cáo”. Việc bạn không ký tên hay kết quả của đơn không làm thay đổi điều này.\nVì sao các phương án còn lại chưa đúng: Không ký tên hay đối tượng tự nguyện làm đơn đều không loại trừ: hành vi bị cấm nằm ở việc kích động, xúi giục, mua chuộc người khác tố cáo, bất kể đơn bị bác hay không.","t":"Không dùng người khác làm công cụ để khiếu nại, tố cáo."},{"s":"B","y":"NH","r":"Điều 6","q":"Sau khi một nhân viên tố cáo sai phạm ở đơn vị, bạn là trưởng bộ phận tìm cách điều chuyển và tạo áp lực công việc đối với người đó. Hành vi này vi phạm điều nào?","o":["Điều 6: trù dập, trả thù người khiếu nại, tố cáo","Điều 9","Điều 14","Điều 16"],"e":"Điều 6 (đoạn hai) cấm “mua chuộc, đe doạ, trù dập, trả thù người khiếu nại, tố cáo, phê bình, góp ý, đấu tranh chống tham nhũng, lãng phí, tiêu cực” và cấm không thực hiện các quy định bảo vệ người tố cáo.\nVì sao các phương án còn lại chưa đúng: Điều 9 nói về kê khai, văn bằng và việc ở nước ngoài; Điều 14 nói về tặng, nhận quà; Điều 16 nói về tài trợ du lịch, học tập, chữa bệnh. Trù dập, trả thù người tố cáo thuộc Điều 6.","t":"Người tố cáo, góp ý, đấu tranh chống tiêu cực phải được bảo vệ, không bị trả thù."},{"s":"B","y":"NH","r":"Điều 7","q":"Bạn cùng vài người họp riêng, hẹn nhau “cùng phe” và phát biểu thống nhất để gây chia rẽ trong chi bộ. Nhận định nào đúng?","o":["Vi phạm Điều 7: tổ chức, xúi giục, tham gia hoạt động bè phái, cục bộ gây mất đoàn kết nội bộ","Không vi phạm vì họp riêng ngoài giờ làm việc","Không vi phạm vì tất cả đều là đảng viên","Chỉ vi phạm nếu có lập biên bản"],"e":"Điều 7 cấm “tổ chức, xúi giục, tham gia các hoạt động bè phái, cục bộ gây mất đoàn kết nội bộ”. Điều khoản không phụ thuộc vào thời gian, địa điểm hay việc có lập biên bản.\nVì sao các phương án còn lại chưa đúng: Họp ngoài giờ, cùng là đảng viên hay không lập biên bản đều không làm thay đổi bản chất. Điều 7 căn cứ vào hoạt động bè phái, cục bộ gây mất đoàn kết nội bộ.","t":"Ý kiến khác nhau nêu trong sinh hoạt chính thức; không lập nhóm phe cánh."},{"s":"B","y":"RG","r":"Điều 7","q":"Tại buổi chất vấn, bạn dùng thời gian để đả kích, xúc phạm cá nhân một cán bộ thay vì hỏi vào nội dung công việc. Nhận định nào đúng?","o":["Vi phạm Điều 7: lợi dụng chất vấn để đả kích, xúc phạm, nhận xét, đánh giá tuỳ tiện","Không vi phạm vì chất vấn là quyền của đảng viên","Không vi phạm vì bạn chỉ nói thẳng","Chỉ vi phạm nếu buổi chất vấn được ghi âm"],"e":"Điều 7 không cấm phản ánh, góp ý, chất vấn đúng nội dung. Điều bị cấm là “lợi dụng” các hoạt động đó để “đả kích, vu cáo, xúc phạm, nhận xét, đánh giá tuỳ tiện đối với tổ chức, cá nhân”.\nVì sao các phương án còn lại chưa đúng: Chất vấn là quyền hợp pháp nên không bị cấm; điều bị cấm là lợi dụng chất vấn để đả kích, xúc phạm. \"Nói thẳng\" không đồng nghĩa với xúc phạm cá nhân, và việc có ghi âm hay không không phải căn cứ của Điều 7.","t":"Chất vấn, góp ý nhằm vào việc, vào vấn đề; không nhằm hạ thấp con người."},{"s":"C","y":"NH","r":"Điều 10","q":"Bạn được giao soạn tiêu chí xét chọn đơn vị tham gia một chương trình hỗ trợ và thêm một điều kiện mà thực tế chỉ doanh nghiệp của người quen đáp ứng được. Hành vi này vi phạm điều nào?","o":["Điều 10: thiết kế tiêu chí, điều kiện mang tính riêng biệt nhằm tạo lợi thế cho một số tổ chức, doanh nghiệp, cá nhân","Không vi phạm vì tiêu chí do bạn soạn trong phạm vi nhiệm vụ","Điều 17: cản trở thanh tra","Điều 19: mê tín"],"e":"Điều 10 cấm “thiết kế tiêu chí, điều kiện mang tính riêng biệt nhằm tạo lợi thế cho một hoặc một số tổ chức, doanh nghiệp, cá nhân tiếp cận nguồn lực gây ra sự cạnh tranh bất bình đẳng”. Soạn trong phạm vi nhiệm vụ không giúp hành vi này hợp lệ.\nVì sao các phương án còn lại chưa đúng: Soạn trong phạm vi nhiệm vụ không biện minh cho một tiêu chí riêng biệt. Điều 17 nói về cản trở kiểm tra, giám sát; Điều 19 nói về mê tín, tôn giáo. Cả hai không liên quan đến việc thiết kế tiêu chí.","t":"Tiêu chí phải áp dụng chung, không đo ni đóng giày cho một bên."},{"s":"C","y":"NH","r":"Điều 10","q":"Bạn phụ trách phân bổ kinh phí hỗ trợ nhưng không công khai tiêu chí, chọn đơn vị nhận theo quan hệ quen biết. Nhận định nào đúng?","o":["Vi phạm Điều 10: huy động, phân bổ, sử dụng nguồn lực thiếu minh bạch, không đúng quy định","Không vi phạm vì bạn có quyền quyết định","Chỉ vi phạm nếu bạn nhận tiền","Không vi phạm vì kinh phí đã được giao cho bạn"],"e":"Điều 10 cấm “thực hiện huy động, phân bổ, sử dụng nguồn lực thiếu minh bạch, không đúng với chủ trương, quy định của Đảng, pháp luật của Nhà nước”. Thiếu minh bạch tự nó đã là vi phạm, không cần có nhận tiền; nhận hối lộ là hành vi riêng ở Điều 13.\nVì sao các phương án còn lại chưa đúng: Có quyền quyết định không có nghĩa là được phân bổ tuỳ ý: Điều 10 yêu cầu minh bạch và đúng quy định. Việc nhận tiền là hành vi riêng (Điều 13) và không phải điều kiện để vi phạm Điều 10.","t":"Phân bổ nguồn lực phải công khai và đúng quy định."},{"s":"C","y":"NH","r":"Điều 11","q":"Bạn làm ở bộ phận một cửa, cố ý hẹn đi hẹn lại, đòi thêm giấy tờ không cần thiết để người dân phải “nhờ vả”. Nhận định nào đúng?","o":["Vi phạm Điều 11: nhũng nhiễu, gây khó khăn trong giải quyết thủ tục hành chính","Không vi phạm vì bạn làm đúng quy trình","Chỉ vi phạm nếu bạn nhận tiền","Không vi phạm vì người dân không phản ánh"],"e":"Điều 11 cấm nhũng nhiễu, gây khó khăn trong giải quyết thủ tục hành chính. Hành vi này bị cấm ngay cả khi không nhận tiền; nhận hối lộ là hành vi riêng thuộc Điều 13.\nVì sao các phương án còn lại chưa đúng: Làm đúng quy trình thì không được đòi thêm giấy tờ không cần thiết để gây khó. Việc nhận tiền thuộc Điều 13; còn Điều 11 đã đủ để xử lý hành vi nhũng nhiễu, bất kể người dân có phản ánh hay không.","t":"Gây khó dễ khi giải quyết thủ tục tự nó đã là vi phạm."},{"s":"C","y":"NH","r":"Điều 11","q":"Việc thuộc thẩm quyền của bạn nhưng bạn cứ đẩy sang bộ phận khác, họp bàn nhiều mà không làm. Biểu hiện này thuộc điều nào?","o":["Điều 11: né tránh, đùn đẩy, sợ trách nhiệm, nói không đi đôi với làm","Điều 4","Điều 14","Điều 18"],"e":"Điều 11 cấm “né tránh, đùn đẩy, sợ trách nhiệm, nói không đi đôi với làm, không làm, làm việc cầm chừng, chậm trễ trong tham mưu, đề xuất và thực hiện nhiệm vụ được giao”.\nVì sao các phương án còn lại chưa đúng: Điều 4 nói về thông tin bí mật; Điều 14 nói về quà tặng; Điều 18 nói về cờ bạc, rượu bia, việc cưới, việc tang. Né tránh, đùn đẩy, sợ trách nhiệm thuộc Điều 11.","t":"Không làm, làm cầm chừng hay chậm trễ nhiệm vụ được giao cũng là vi phạm."},{"s":"C","y":"RG","r":"Điều 11","q":"Trường hợp nào sau đây KHÔNG vi phạm Quy định?","o":["Đề xuất đúng thẩm quyền một cách làm mới vì lợi ích chung và chịu trách nhiệm về đề xuất của mình","Dùng cơ chế thí điểm để bao che cho một doanh nghiệp quen biết","Để người thân lợi dụng chức vụ của mình để trục lợi","Biết đơn vị mình quản lý có tham nhũng nhưng không báo cáo"],"e":"Quy định không hạn chế tinh thần đổi mới sáng tạo, dám nghĩ, dám làm vì lợi ích chung. Điều 11 chỉ cấm lợi dụng cơ chế, chính sách thí điểm, đặc thù để thực hiện hoặc bao che hành vi vụ lợi; cấm để người thân lợi dụng chức vụ, quyền hạn để trục lợi; và cấm biết mà không báo cáo hành vi tham nhũng, lãng phí, tiêu cực.\nVì sao các phương án còn lại chưa đúng: Ba phương án còn lại đều là hành vi bị cấm ở Điều 11: lợi dụng cơ chế thí điểm để bao che; để người thân lợi dụng chức vụ để trục lợi; biết tham nhũng mà không báo cáo. Quy định còn nêu rõ không hạn chế tinh thần đổi mới sáng tạo vì lợi ích chung.","t":"Dám nghĩ, dám làm vì lợi ích chung được khuyến khích và bảo vệ; vì lợi ích riêng thì bị cấm."},{"s":"C","y":"NH","r":"Điều 11","q":"Bạn là trưởng phòng, biết cấp dưới nhận tiền “bôi trơn” nhưng im lặng vì sợ ảnh hưởng thành tích đơn vị. Nhận định nào đúng?","o":["Vi phạm Điều 11: biết mà không báo cáo, không xử lý hoặc không chỉ đạo xử lý hành vi tham nhũng, lãng phí, tiêu cực","Không vi phạm vì bạn không trực tiếp nhận tiền","Chỉ vi phạm nếu số tiền lớn","Chỉ cấp dưới chịu trách nhiệm"],"e":"Điều 11 cấm “biết mà không báo cáo, không xử lý hoặc không chỉ đạo xử lý các hành vi tham nhũng, lãng phí, tiêu cực” và cấm thiếu trách nhiệm để đơn vị do mình trực tiếp quản lý xảy ra tham nhũng, lãng phí, tiêu cực. Điều khoản không đặt ngưỡng số tiền.\nVì sao các phương án còn lại chưa đúng: Không trực tiếp nhận tiền hay số tiền nhỏ không loại trừ trách nhiệm. Điều 11 gắn trách nhiệm cho người biết mà không báo cáo, không xử lý và cho người quản lý để đơn vị mình xảy ra tham nhũng, lãng phí, tiêu cực.","t":"Biết mà giấu cũng là vi phạm; người quản lý càng phải chủ động xử lý."},{"s":"D","y":"NH","r":"Điều 1","q":"Bạn biết một việc bị pháp luật cấm nhưng vẫn làm vì “ai cũng làm”. Nhận định nào đúng?","o":["Vi phạm Điều 1: làm những việc mà pháp luật không cho phép, làm trái chủ trương, quy định của Đảng, pháp luật","Không vi phạm vì chưa bị xử phạt","Không vi phạm vì nhiều người cũng làm","Chỉ vi phạm nếu việc đó gây thiệt hại vật chất"],"e":"Điều 1 là điều khái quát: nói, viết, làm trái hoặc không thực hiện chủ trương, quy định của Đảng, pháp luật của Nhà nước; làm những việc mà pháp luật không cho phép. Điều khoản không đặt điều kiện đã bị xử phạt hay có thiệt hại.\nVì sao các phương án còn lại chưa đúng: Chưa bị xử phạt, nhiều người cùng làm hay chưa gây thiệt hại không làm hành vi hợp pháp. Điều 1 gắn với việc làm điều pháp luật không cho phép và làm trái quy định của Đảng.","t":"Đảng viên phải gương mẫu chấp hành pháp luật; việc pháp luật không cho phép thì không làm."},{"s":"D","y":"NH","r":"Điều 2","q":"Một tổ chức nước ngoài mời bạn giữ chức danh trong ban điều hành của họ. Điều nào đúng theo Điều 2?","o":["Chỉ được nhận đề cử, ứng cử khi đã được tổ chức đảng có thẩm quyền cho phép","Chỉ cần báo cho gia đình","Chỉ cần được cơ quan nhà nước cùng cấp đồng ý","Không cần xin phép nếu chức danh không có thù lao"],"e":"Điều 2 cấm tự ứng cử, nhận đề cử và đề cử các chức danh của tổ chức nhà nước, Mặt trận Tổ quốc Việt Nam, các tổ chức chính trị - xã hội, các hội quần chúng, tổ chức tôn giáo, tổ chức nước ngoài “khi chưa được tổ chức đảng có thẩm quyền cho phép”. Điều khoản không phân biệt có thù lao hay không.\nVì sao các phương án còn lại chưa đúng: Báo gia đình, hay chỉ xin ý kiến cơ quan nhà nước đều không thay được sự cho phép của tổ chức đảng có thẩm quyền. Điều 2 cũng không phân biệt chức danh có thù lao hay không.","t":"Với các tổ chức nêu ở Điều 2, phải được tổ chức đảng có thẩm quyền cho phép trước."},{"s":"D","y":"NH","r":"Điều 12","q":"Bạn nhờ một người quen có chức vụ “nói giúp” để con mình được tuyển dụng vào một vị trí dù chưa đủ điều kiện. Hành vi của bạn thuộc điều nào?","o":["Điều 12","Điều 7","Điều 9","Điều 18"],"e":"Điều 12 cấm chạy chức, chạy quyền, bao che, tiếp tay, can thiệp, tác động dưới mọi hình thức để bản thân hoặc người khác được tiếp nhận, tuyển dụng… trái quy định. “Người khác” bao gồm cả người thân.\nVì sao các phương án còn lại chưa đúng: Điều 7 nói về bè phái, chất vấn; Điều 9 nói về kê khai, văn bằng, tài sản ở nước ngoài; Điều 18 nói về cờ bạc, rượu bia, việc cưới, việc tang. Nhờ người có chức vụ \"nói giúp\" để được tuyển dụng trái quy định thuộc Điều 12.","t":"Không nhờ vả, can thiệp để bản thân hay người thân được tuyển dụng, bổ nhiệm trái quy định."},{"s":"D","y":"RG","r":"Điều 12","q":"Bạn mong được đề bạt. Việc nào sau đây bạn KHÔNG được làm?","o":["Nhờ vả, tác động người có thẩm quyền để mình được bổ nhiệm trái quy định","Hoàn thành tốt nhiệm vụ để tổ chức xem xét theo quy trình","Hoàn thiện hồ sơ theo hướng dẫn của cơ quan","Trao đổi nguyện vọng công tác với người phụ trách theo đúng quy định"],"e":"Điều 12 cấm chạy chức, chạy quyền, can thiệp, tác động dưới mọi hình thức để được bổ nhiệm, đề cử, ứng cử… trái quy định. Làm tốt việc, hoàn thiện hồ sơ và trao đổi đúng quy định không bị cấm.\nVì sao các phương án còn lại chưa đúng: Hoàn thành tốt nhiệm vụ, hoàn thiện hồ sơ và trao đổi nguyện vọng đúng quy định đều là cách làm chính đáng. Điều bị cấm là tác động, nhờ vả để được bổ nhiệm trái quy định.","t":"Được xem xét bằng năng lực và quy trình, không bằng quan hệ."},{"s":"D","y":"NH","r":"Điều 12","q":"Bạn chưa đủ tiêu chuẩn xét tặng một danh hiệu nhưng nhờ người quen có chức vụ “tác động” để được xét. Nhận định nào đúng?","o":["Vi phạm Điều 12: tác động để được khen thưởng, phong tặng danh hiệu trái quy định","Không vi phạm vì chỉ nhờ vả, chưa nhận danh hiệu","Không vi phạm vì danh hiệu không có thù lao","Chỉ vi phạm nếu có đưa tiền"],"e":"Điều 12 liệt kê cả “khen thưởng, phong, thăng quân hàm, phong tặng danh hiệu” trong các nội dung không được can thiệp, tác động “dưới mọi hình thức” trái quy định. Việc nhờ tác động đã là hành vi bị cấm; đưa tiền còn thuộc Điều 13.\nVì sao các phương án còn lại chưa đúng: Chỉ nhờ vả, chưa nhận danh hiệu vẫn là hành vi can thiệp, tác động bị cấm. Danh hiệu không có thù lao không làm hành vi hợp lệ, và Điều 12 không đòi hỏi phải có đưa tiền; đưa tiền còn có thể vi phạm Điều 13.","t":"Khen thưởng, danh hiệu phải do đủ tiêu chuẩn, không do chạy."},{"s":"D","y":"NH","r":"Điều 12","q":"Nhân đợt sắp xếp bộ máy, bạn đưa một người thân thiếu năng lực, uy tín vào vị trí quản lý ngân sách. Nhận định nào đúng?","o":["Vi phạm Điều 12: lợi dụng việc sắp xếp tổ chức bộ máy để bố trí người không đủ năng lực, uy tín vào vị trí có quyền phân bổ nguồn lực","Không vi phạm vì sắp xếp bộ máy thuộc thẩm quyền của bạn","Không vi phạm vì đó là người thân đáng tin cậy","Chỉ vi phạm nếu người đó gây thất thoát"],"e":"Điều 12 (câu cuối) cấm “lợi dụng việc sắp xếp tổ chức bộ máy để bố trí người không đủ năng lực, uy tín vào vị trí có quyền phân bổ nguồn lực”. Điều khoản nhắm vào việc bố trí không đủ năng lực, uy tín, không chờ đến khi có thất thoát.\nVì sao các phương án còn lại chưa đúng: Có thẩm quyền sắp xếp bộ máy không có nghĩa là được bố trí người không đủ năng lực, uy tín. \"Người thân đáng tin cậy\" không thay cho tiêu chuẩn năng lực, uy tín, và Điều 12 không chờ đến khi có thất thoát mới áp dụng.","t":"Bố trí người theo năng lực, uy tín, không theo quan hệ thân quen."},{"s":"E","y":"NH","r":"Điều 9","q":"Khi kê khai tài sản, thu nhập, bạn bỏ sót một khoản thu nhập lớn và khi được yêu cầu giải trình đã đưa ra thông tin không đúng sự thật. Hành vi thuộc điều nào?","o":["Điều 9","Điều 5","Điều 14","Điều 15"],"e":"Điều 9 cấm báo cáo, lập hồ sơ, kê khai lý lịch, kê khai tài sản, thu nhập và giải trình nguồn gốc của tài sản, thu nhập có biến động “không trung thực”.\nVì sao các phương án còn lại chưa đúng: Điều 5 nói về thông tin sai sự thật; Điều 14 nói về quà tặng; Điều 15 nói về tài sản công, lãng phí, tẩu tán tài sản. Kê khai, giải trình tài sản, thu nhập không trung thực thuộc Điều 9.","t":"Kê khai và giải trình tài sản, thu nhập phải trung thực."},{"s":"E","y":"NH","r":"Điều 9","q":"Bạn nộp hồ sơ dự tuyển kèm một chứng chỉ mua trôi nổi, không do cơ sở có thẩm quyền cấp. Nhận định nào đúng?","o":["Vi phạm Điều 9: sử dụng văn bằng, chứng chỉ, chứng nhận không hợp pháp","Không vi phạm nếu chứng chỉ chỉ là điều kiện phụ","Không vi phạm vì chưa được tuyển dụng","Chỉ vi phạm khi đó là bằng đại học"],"e":"Điều 9 cấm “sử dụng văn bằng, chứng chỉ, chứng nhận không hợp pháp”, không phân biệt loại văn bằng, chứng chỉ hay kết quả tuyển dụng.\nVì sao các phương án còn lại chưa đúng: Chứng chỉ chỉ là điều kiện phụ, chưa được tuyển dụng hay không phải bằng đại học đều không loại trừ: Điều 9 cấm sử dụng văn bằng, chứng chỉ, chứng nhận không hợp pháp nói chung.","t":"Chỉ dùng văn bằng, chứng chỉ, chứng nhận hợp pháp."},{"s":"E","y":"RG","r":"Điều 9","q":"Bạn dự định chuyển một khoản tiền ra nước ngoài, mở tài khoản và mua tài sản ở nước ngoài. Điều nào đúng theo Điều 9?","o":["Bị cấm nếu trái quy định, vì vậy bạn cần thực hiện đúng quy định","Mọi trường hợp đều bị cấm tuyệt đối","Việc này không liên quan đến Quy định","Chỉ cần báo cho gia đình biết"],"e":"Điều 9 (đoạn hai) cấm “chuyển tiền, tài sản ra nước ngoài, mở tài khoản và mua bán tài sản ở nước ngoài, nhập quốc tịch trái quy định”. Cụm “trái quy định” là mấu chốt: điều cấm gắn với việc làm trái quy định.\nVì sao các phương án còn lại chưa đúng: Điều 9 không cấm tuyệt đối mọi việc ở nước ngoài mà cấm khi \"trái quy định\"; vì vậy phương án \"cấm tuyệt đối\" là quá mức. Đây cũng không phải việc \"không liên quan\" tới Quy định, và chỉ báo cho gia đình không thay cho việc thực hiện đúng quy định.","t":"Việc liên quan tiền, tài sản, quốc tịch ở nước ngoài phải đúng quy định."},{"s":"E","y":"NH","r":"Điều 13","q":"Một doanh nghiệp nhờ bạn chuyển giúp một phong bì cho lãnh đạo để hồ sơ được duyệt. Bạn chỉ chuyển giúp và không lấy gì. Nhận định nào đúng?","o":["Vi phạm Điều 13: môi giới hối lộ","Không vi phạm vì bạn không nhận gì","Chỉ bên nhận mới vi phạm","Không vi phạm vì bạn chỉ làm trung gian"],"e":"Điều 13 cấm tham ô, đưa, nhận, môi giới hối lộ hoặc lợi dụng vị trí công tác để môi giới, hối lộ dưới mọi hình thức. Người đứng giữa kết nối, chuyển giúp là hành vi môi giới.\nVì sao các phương án còn lại chưa đúng: Môi giới hối lộ cũng bị cấm như đưa và nhận, không chỉ bên nhận. Không lấy gì cho mình hay chỉ làm trung gian không loại trừ trách nhiệm theo Điều 13.","t":"Đưa, nhận hay môi giới hối lộ đều bị cấm."},{"s":"E","y":"NH","r":"Điều 14","q":"Trước kỳ xét duyệt hồ sơ, một doanh nghiệp có hồ sơ đang chờ bạn duyệt biếu bạn một món quà giá trị. Điều nào đúng?","o":["Nhận quà để tác động đến người có trách nhiệm dẫn đến quyết định sai, có lợi ích riêng là bị cấm (Điều 14), dưới mọi hình thức","Không vi phạm vì là quà biếu ngày Tết","Không vi phạm vì quà không phải tiền mặt","Chỉ vi phạm khi quà vượt một mức giá trị cố định do Quy định nêu"],"e":"Điều 14 cấm tặng, nhận quà dưới mọi hình thức để tác động đến tổ chức, người có trách nhiệm dẫn đến việc quyết định sai, có lợi ích riêng. Điều khoản không nêu mức giá trị cố định và không giới hạn ở tiền mặt.\nVì sao các phương án còn lại chưa đúng: Quà dịp lễ, Tết hay không phải tiền mặt vẫn có thể là quà để tác động khi đang chờ quyết định công việc. Điều 14 cấm \"dưới mọi hình thức\" và không nêu mức giá trị cố định.","t":"Quà gắn với công việc mình đang quyết định là điểm dừng: từ chối."},{"s":"E","y":"NH","r":"Điều 15","q":"Bạn dùng xe và kinh phí của cơ quan cho chuyến đi riêng của gia đình. Hành vi này thuộc điều nào?","o":["Điều 15: sử dụng tài chính, tài sản công trái quy định","Điều 5","Điều 7","Điều 19"],"e":"Điều 15 cấm đầu tư, mua sắm, quản lý, sử dụng tài chính, tài sản công trái quy định, cũng như không thực hành tiết kiệm và để thất thoát, lãng phí các nguồn lực.\nVì sao các phương án còn lại chưa đúng: Điều 5 nói về thông tin sai sự thật; Điều 7 về bè phái, chất vấn; Điều 19 về mê tín, tôn giáo. Dùng xe, kinh phí cơ quan cho việc riêng là sử dụng tài sản công trái quy định, thuộc Điều 15.","t":"Tài sản công, kinh phí cơ quan chỉ dùng cho việc chung theo đúng quy định."},{"s":"E","y":"NH","r":"Điều 15","q":"Biết sắp bị kiểm tra, bạn vội chuyển nhượng tài sản và sửa sổ sách để hợp thức hoá sai phạm. Hành vi này thuộc điều nào?","o":["Điều 15: tẩu tán tài sản, hợp thức hoá sai phạm","Điều 4","Điều 8","Điều 19"],"e":"Điều 15 (câu cuối) cấm “tẩu tán tài sản, hợp thức hoá sai phạm”. Việc sửa sổ sách để che sai phạm đồng thời có thể cản trở hoạt động kiểm tra (Điều 17).\nVì sao các phương án còn lại chưa đúng: Điều 4 nói về thông tin bí mật; Điều 8 về hội trái quy định, tụ tập đông người; Điều 19 về mê tín, tôn giáo. Tẩu tán tài sản, hợp thức hoá sai phạm thuộc Điều 15; hành vi này còn có thể dẫn tới vi phạm Điều 17 nếu cản trở kiểm tra.","t":"Che giấu hay hợp thức hoá sai phạm chỉ làm vi phạm nặng thêm."},{"s":"E","y":"NH","r":"Điều 16","q":"Bạn phụ trách theo dõi một ngành, chủ động đề nghị một doanh nghiệp trong ngành đó tài trợ toàn bộ chi phí du lịch cho gia đình mình. Hành vi thuộc điều nào?","o":["Điều 16","Điều 9","Điều 15","Điều 18"],"e":"Điều 16 cấm can thiệp, tác động để bản thân, người thân thích, người khác đi du lịch, học tập, chữa bệnh bằng nguồn tài trợ của tổ chức, cá nhân có liên quan đến ngành, lĩnh vực, địa phương, địa bàn được giao theo dõi, quản lý.\nVì sao các phương án còn lại chưa đúng: Điều 9 nói về kê khai, văn bằng, tài sản ở nước ngoài; Điều 15 về tài sản công, lãng phí; Điều 18 về cờ bạc, việc cưới, việc tang, vô cảm. Chủ động nhờ nguồn tài trợ liên quan đến lĩnh vực mình quản lý để đi du lịch thuộc Điều 16.","t":"Không nhận tài trợ du lịch, học tập, chữa bệnh từ đối tượng thuộc lĩnh vực mình quản lý."},{"s":"F","y":"NH","r":"Điều 17","q":"Biết đoàn kiểm tra sắp làm việc tại đơn vị, bạn nhờ một người có chức vụ cao gọi điện đề nghị đoàn “làm nhẹ” kết luận về sai phạm của mình. Hành vi thuộc điều nào?","o":["Điều 17","Điều 5","Điều 8","Điều 19"],"e":"Điều 17 cấm cản trở, can thiệp, tác động, áp đặt vào hoạt động kiểm tra, giám sát, thanh tra… để làm sai lệch, bao che; và cấm tác động, ép buộc, mua chuộc tổ chức, cá nhân để giảm trách nhiệm, mức xử lý cho bản thân.\nVì sao các phương án còn lại chưa đúng: Điều 5 nói về thông tin sai sự thật; Điều 8 về hội trái quy định, tụ tập; Điều 19 về mê tín, tôn giáo. Nhờ người khác tác động để đoàn kiểm tra \"làm nhẹ\" kết luận thuộc Điều 17.","t":"Không nhờ người khác tác động để giảm trách nhiệm, mức xử lý."},{"s":"F","y":"RG","r":"Điều 17","q":"Sau khi có kết luận kiểm tra về mình, bạn không đồng ý. Việc nào sau đây bạn KHÔNG được làm?","o":["Không chấp hành kết luận, quyết định của cơ quan có thẩm quyền","Giải trình đầy đủ, trung thực","Gửi khiếu nại đến cơ quan có thẩm quyền giải quyết","Đề nghị xem xét lại theo đúng quy định"],"e":"Điều 17 (câu cuối) cấm “không chấp hành kết luận, quyết định của cơ quan có thẩm quyền”. Giải trình trung thực, khiếu nại đến nơi có thẩm quyền và đề nghị xem xét lại theo quy định không bị cấm.\nVì sao các phương án còn lại chưa đúng: Giải trình đầy đủ, trung thực, khiếu nại đến nơi có thẩm quyền và đề nghị xem xét lại theo quy định đều là quyền hợp pháp. Điều bị cấm là không chấp hành kết luận, quyết định của cơ quan có thẩm quyền.","t":"Không đồng ý thì giải trình, khiếu nại đúng nơi; không được không chấp hành."},{"s":"F","y":"NH","r":"Điều 8","q":"Bạn được rủ tham gia một cuộc tụ tập đông người trước trụ sở, gây ùn tắc và mất trật tự. Nhận định nào đúng?","o":["Vi phạm Điều 8: tham gia tụ tập đông người gây mất an ninh, trật tự, an toàn xã hội","Không vi phạm vì bạn không phát biểu","Không vi phạm vì bạn đi cùng gia đình","Chỉ vi phạm nếu bị lập biên bản xử phạt"],"e":"Điều 8 cấm “tham gia biểu tình, tụ tập đông người gây mất an ninh, trật tự, an toàn xã hội”, cũng như tổ chức, tham gia, tài trợ, giúp tổ chức, hội trái quy định của Đảng, pháp luật của Nhà nước.\nVì sao các phương án còn lại chưa đúng: Không phát biểu hay đi cùng gia đình không làm thay đổi việc tham gia tụ tập đông người gây mất trật tự. Điều 8 không đòi hỏi phải bị lập biên bản xử phạt.","t":"Không tham gia tụ tập đông người gây mất trật tự, dù chỉ đi theo."},{"s":"G","y":"RG","r":"Điều 18","q":"Việc nào sau đây là việc đảng viên KHÔNG được làm?","o":["Tham gia đánh bạc ăn tiền “cho vui” với bạn bè","Uống rượu, bia đúng quy định, không có hành vi trái đạo đức xã hội hay vi phạm pháp luật","Tổ chức đám cưới con đúng quy định, giản dị, tiết kiệm","Tham gia hoạt động từ thiện ở địa phương"],"e":"Điều 18 cấm “tổ chức, tham gia đánh bạc dưới mọi hình thức”, “sử dụng các chất ma tuý”, và sử dụng rượu, bia “không đúng quy định hoặc đến mức có những hành vi trái đạo đức xã hội, vi phạm pháp luật”. Ba việc còn lại không bị cấm.\nVì sao các phương án còn lại chưa đúng: Uống rượu, bia đúng quy định, tổ chức đám cưới giản dị, tiết kiệm và tham gia hoạt động từ thiện đều không bị cấm. Điều 18 cấm đánh bạc \"dưới mọi hình thức\", nghĩa là kể cả đánh bạc \"cho vui\".","t":"“Dưới mọi hình thức”: đánh bạc cho vui vẫn là đánh bạc."},{"s":"G","y":"NH","r":"Điều 18","q":"Bạn tổ chức đám cưới cho con, mời rất đông khách, phô trương và thu “mừng” nhằm kiếm lời. Nhận định nào đúng?","o":["Vi phạm Điều 18: tổ chức việc cưới xa hoa, lãng phí hoặc nhằm mục đích vụ lợi","Không vi phạm vì đây là việc riêng của gia đình","Không vi phạm vì khách tự nguyện mừng","Chỉ vi phạm nếu số khách vượt một con số cố định"],"e":"Điều 18 cấm “tổ chức việc cưới, việc tang và các sự kiện khác của cá nhân, gia đình không đúng quy định, xa hoa, lãng phí hoặc nhằm mục đích vụ lợi”. Điều khoản không đặt số lượng khách cố định.\nVì sao các phương án còn lại chưa đúng: Việc cưới của gia đình vẫn phải đúng quy định, không xa hoa, lãng phí hay nhằm vụ lợi. Khách tự nguyện mừng không loại trừ mục đích vụ lợi, và Điều 18 không nêu số lượng khách cố định.","t":"Việc cưới, việc tang tổ chức đúng quy định, tiết kiệm, không vụ lợi."},{"s":"G","y":"NH","r":"Điều 18","q":"Bạn thấy một người hàng xóm bị bạo hành nhưng bỏ đi vì “không phải việc của mình”. Theo Quy định, thái độ này thuộc điều nào?","o":["Điều 18: thờ ơ, vô cảm với các hành vi sai trái trong xã hội","Điều 9","Điều 13","Điều 16"],"e":"Điều 18 cấm “thờ ơ, vô cảm với các hành vi sai trái trong xã hội”, cùng với bạo lực trong gia đình và vi phạm quy định về hôn nhân, gia đình, về kết hôn với người nước ngoài.\nVì sao các phương án còn lại chưa đúng: Điều 9 nói về kê khai, văn bằng; Điều 13 về hối lộ; Điều 16 về tài trợ du lịch, học tập, chữa bệnh. Thờ ơ, vô cảm trước hành vi sai trái trong xã hội, trong đó có bạo lực gia đình, thuộc Điều 18.","t":"Đảng viên không được thờ ơ, vô cảm trước hành vi sai trái trong xã hội."},{"s":"G","y":"NH","r":"Điều 19","q":"Bạn lợi dụng hoạt động tín ngưỡng, tôn giáo ở địa phương để kêu gọi quyên góp rồi giữ lại làm lợi riêng. Nhận định nào đúng?","o":["Vi phạm Điều 19: lợi dụng hoạt động tôn giáo, tín ngưỡng để trục lợi","Không vi phạm vì đây là việc thiện","Không vi phạm vì người dân tự nguyện đóng góp","Chỉ vi phạm nếu tổ chức tôn giáo đó bất hợp pháp"],"e":"Điều 19 cấm mê tín, hoạt động mê tín; ủng hộ hoặc tham gia các tôn giáo bất hợp pháp; và “lợi dụng các hoạt động tôn giáo, tín ngưỡng, cơ chế, chính sách dân tộc để trục lợi, thực hiện hành vi trái đạo đức xã hội, vi phạm pháp luật”. Việc lợi dụng để trục lợi bị cấm dù tổ chức đó hợp pháp.\nVì sao các phương án còn lại chưa đúng: Mục đích \"việc thiện\" hay người dân tự nguyện đóng góp không loại trừ việc lợi dụng để trục lợi. Điều 19 cấm lợi dụng hoạt động tôn giáo, tín ngưỡng để trục lợi và không chỉ áp dụng khi tổ chức tôn giáo bất hợp pháp.","t":"Không lợi dụng tôn giáo, tín ngưỡng để trục lợi."}]};

 S={view:'quiz',mode:m,qs:qs,ans:saved?saved.ans:{},flag:saved?saved.flag:{},cur:saved?saved.cur:0,t0:Date.now()-(saved?saved.el*1000:0),el:saved?saved.el:0,done:false,filter:'all',confirm:false};
 clearInterval(timer);timer=setInterval(function(){if(S&&S.view==='quiz'){S.el=Math.floor((Date.now()-S.t0)/1000);var e=document.getElementById('tm');if(e)e.textContent=mmss(S.el);if(S.el%5===0)saveProg()}},1000);
 render();window.scrollTo(0,0);
}function compute(){
 var n=S.qs.length,c=0,bl=0,th={},ty={};
 S.qs.forEach(function(q,k){var a=S.ans[k],ok=a!==undefined&&q.opts[a].ok;if(a===undefined)bl++;if(ok)c++;
  [[th,q.b.s],[ty,q.b.y]].forEach(function(p){var m=p[0],key=p[1];m[key]=m[key]||{n:0,c:0};m[key].n++;if(ok)m[key].c++})});
 return {n:n,c:c,bl:bl,wr:n-c-bl,score:c*10/n,th:th,ty:ty};
}
function commentary(r){
 var out=[],weak=[],bestK=null,bp=-1;
 Object.keys(r.th).forEach(function(k){var p=pct(r.th[k].c,r.th[k].n);if(p<70)weak.push(THEMES[k].t+' ('+THEMES[k].d+')');if(p>bp){bp=p;bestK=k}});
 if(r.c===r.n)out.push('Bạn trả lời đúng toàn bộ các tình huống.');
 if(bestK&&bp>=70)out.push('Nhóm làm tốt nhất: '+THEMES[bestK].t+' ('+bp+'%).');
 if(weak.length)out.push('Nên ôn lại: '+weak.join('; ')+'.');
 if(r.ty.RG&&pct(r.ty.RG.c,r.ty.RG.n)<60)out.push('Bạn còn nhầm ở các câu phân biệt ranh giới giữa việc được làm và không được làm: hãy đọc kỹ từng lựa chọn và dòng “Cần nhớ”.');
 if(r.bl)out.push('Còn '+r.bl+' câu chưa trả lời.');
 return out;
}
function optHtml(q,k,mode2){
 // mode2: 'live' | 'review'
 var L='ABCD',h='';
 q.opts.forEach(function(o,j){
  var cls='opt',dis='';
  var a=S.ans[k];
  if(mode2==='review'||(S.mode==='learn'&&a!==undefined)){
   dis=' disabled';
   if(o.ok)cls+=' ok';else if(a===j)cls+=' bad';
  } else if(a===j)cls+=' sel';
  var mark=(mode2==='review'||(S.mode==='learn'&&a!==undefined))?(o.ok?' ✓':(a===j?' ✗':'')):'';
  h+='<button class="'+cls+'" data-act="opt" data-j="'+j+'"'+dis+'><span class="k">'+L[j]+'</span><span class="tx">'+esc(o.t)+'<b>'+mark+'</b></span></button>';
 });
 return h;
}

function statsComment(d){

 if(bestK&&bp>=70)o.push('Nhóm nội dung nắm tốt nhất: '+THEMES[bestK].t+' ('+bp+'% câu đúng).');

 return o;
}

 Object.keys(TYPES).forEach(function(k){var m=d.ty[k];if(!m||!m.n)return;var p=pct(m.c,m.n),l=lvl(p);h+='<div class="'+l[0]+'"><div class="meter-top"><b>'+esc(TYPES[k])+'</b><span>'+p+'% · '+l[1]+'</span></div><div class="mbar"><i data-w="'+p+'"></i></div></div>'});
 h+='</div></div>';
 var qs=(d.q||[]).filter(function(x){return x.n>=1}).map(function(x){return {i:x.i,p:pct(x.c,x.n),n:x.n}}).sort(function(a,b){return a.p-b.p||b.n-a.n}).slice(0,8);
 if(qs.length){h+='<div class="sec"><div class="sec-t">Những câu nhiều người trả lời sai nhất</div><ul class="hq">';qs.forEach(function(x){var b=BANK[x.i];if(!b)return;h+='<li><b>'+x.p+'% đúng</b> · '+esc(b.r)+' — '+esc(b.q)+'<br><span style="color:var(--muted)">Cần nhớ: '+esc(b.t)+'</span></li>'});h+='</ul></div>'}
 h+='<p class="best">Số liệu ẩn danh, cập nhật lúc '+esc(new Date(d.updated).toLocaleString('vi-VN'))+'.</p></div>';
 return h;
}
function render_(){
 var h=S===null||S.view==='start'?viewStart():S.view==='quiz'?viewQuiz():S.view==='stats'?viewStats():viewResult();
 app.innerHTML=h;
 if(S&&S.view==='stats'){setTimeout(function(){var ms=document.querySelectorAll('.mbar i');for(var i=0;i<ms.length;i++)ms[i].style.width=ms[i].getAttribute('data-w')+'%'},30)}
 if(S&&S.view==='result'){
  var r=S.res,fg=document.getElementById('rfg'),rn=document.getElementById('rn');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function(){if(fg)fg.style.strokeDashoffset=String(326.7*(1-r.score/10));var ms=document.querySelectorAll('.mbar i');for(var i=0;i<ms.length;i++)ms[i].style.width=ms[i].getAttribute('data-w')+'%'},30);
  if(reduce){rn.textContent=fmt(r.score)}else{var t0=performance.now();(function step(t){var p=Math.min(1,(t-t0)/1000);rn.textContent=fmt(r.score*p);if(p<1)requestAnimationFrame(step);else rn.textContent=fmt(r.score)})(t0)}
 }
}
function render(){render_();if(S&&S.view==='quiz')saveProg()}
function finish(){
 clearInterval(timer);S.el=Math.floor((Date.now()-S.t0)/1000);S.res=compute();S.view='result';S.confirm=false;clearProg(S.mode);
 if(S.qs.length===BANK.length){var g=gradeOf(S.res.score);if(!best||S.res.score>best.s){best={s:S.res.score,g:g.name};ls('qd207_best',JSON.stringify(best))}}
 if(S.qs.length===BANK.length&&ENDPOINT){var th={},ty={};['th','ty'].forEach(function(w){var src=S.res[w],dst=w==='th'?th:ty;Object.keys(src).forEach(function(k){dst[k]=[src[k].c,src[k].n]})});
  send({t:'result',mode:S.mode,score:S.res.score,c:S.res.c,n:S.res.n,secs:S.el,q:S.qs.map(function(q,k){var a=S.ans[k];return [q.i,a===undefined?-1:(q.opts[a].ok?1:0)]}),th:th,ty:ty});S.sent=true}
 sfx(S.res.score>=5?'win':'end');render();window.scrollTo(0,0);
}
function pick(j){
 var k=S.cur;if(S.mode==='learn'&&S.ans[k]!==undefined)return;
 if(S.mode==='exam'&&S.ans[k]===j){delete S.ans[k];sfx('tick')}else{S.ans[k]=j;sfx(S.mode==='learn'?(S.qs[k].opts[j].ok?'ok':'bad'):'tick')}
 render();
}
function goto(i){if(i<0||i>=S.qs.length)return;S.cur=i;render();window.scrollTo(0,0)}
app.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act');
 if(a==='snd')return toggleSnd();
 if(a==='theme')return toggleTheme();
 if(a==='mode'){mode=el.getAttribute('data-m');askRestart=false;return render()}
 if(a==='rs_no'){askRestart=false;return render()}
 if(a==='rs_ok'){askRestart=false;clearProg(mode);return newSession(mode,BANK.map(function(_,i){return i}))}
 if(a==='resume'){var rd=readProg(mode);if(!rd){S=null;return render()}return newSession(rd.mode,rd.idx,rd)}
 if(a==='stats')return loadStats();
 if(a==='start'&&readProg(mode)){askRestart=true;return render()}
 if(a==='start')return newSession(mode,BANK.map(function(_,i){return i}));
 if(a==='home'){if(S&&S.view==='quiz')saveProg();clearInterval(timer);S=null;render();return window.scrollTo(0,0)}
 if(!S)return;
 if(a==='opt')return pick(+el.getAttribute('data-j'));
 if(a==='go')return goto(+el.getAttribute('data-i'));
 if(a==='prev')return goto(S.cur-1);
 if(a==='next'){if(S.cur===S.qs.length-1){S.confirm=true;return render()}return goto(S.cur+1)}
 if(a==='flag'){S.flag[S.cur]=!S.flag[S.cur];return render()}
 if(a==='submit'){S.confirm=true;return render()}
 if(a==='cancel'){S.confirm=false;return render()}
 if(a==='confirm')return finish();
 if(a==='filter'){S.filter=el.getAttribute('data-f');return render()}
 if(a==='again')return newSession(S.mode,BANK.map(function(_,i){return i}));
 if(a==='redo'){var idx=[];S.qs.forEach(function(q,k){var x=S.ans[k];if(!(x!==undefined&&q.opts[x].ok))idx.push(q.i)});return newSession('learn',idx)}
});
document.addEventListener('keydown',function(e){
 if(!S||S.view!=='quiz'||e.ctrlKey||e.metaKey||e.altKey)return;
 var k=e.key.toLowerCase();
 if(k.length===1){var j='abcd'.indexOf(k);if(j<0)j='1234'.indexOf(k);if(j>=0&&j<S.qs[S.cur].opts.length&&!S.confirm){pick(j)}return}
 if(S.confirm)return;
 if(k==='arrowright')goto(S.cur+1);else if(k==='arrowleft')goto(S.cur-1);else if(k==='enter'&&S.mode==='learn'&&S.ans[S.cur]!==undefined&&S.cur<S.qs.length-1)goto(S.cur+1);
});
function flush(){if(S&&S.view==='quiz'){S.el=Math.floor((Date.now()-S.t0)/1000);saveProg()}}
document.addEventListener('visibilitychange',function(){if(document.hidden)flush()});window.addEventListener('pagehide',flush);
theme();pingVisit();
var bt=document.getElementById('boot');if(bt)bt.parentNode.removeChild(bt);
render();
})();
</script>
</body>
</html>
